<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Dashboard Project</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 class="main-title">JavaScript API Dashboard</h1>
    <div class="grid-container">
      <section class="grid-item" id="dog-api">
        <h2>🐶 Random Dog</h2>
        <button id="dog-button" onclick="getDogImage()">Get Dog</button>
        <div class="output" id="dog-output"></div>
      </section>

      <section class="grid-item" id="cat-api">
        <h2>🐱 Random Cat</h2>
        <button id="cat-button" onclick="getCatImage()">Get Cat</button>
        <div class="output" id="cat-output"></div>
      </section>

      <section class="grid-item" id="weather-api">
        <h2>☀️ Weather Info</h2>
        <button id="weatherBtn" onclick="getWeather()">Get Weather</button>
        <div class="output" id="weather-output"></div>
      </section>

      <section class="grid-item" id="currency-api">
        <h2>💱 Currency Rates</h2>
        <button id="currencyBtn" onclick="getCurrency()">Get Rates</button>
        <div class="output" id="currency-output"></div>
      </section>

      <section class="grid-item" id="movies-api">
        <h2>🎮 Trending Movies</h2>
        <button id="movieBtn">Get Movies</button>
        <div class="output" id="movie-output"></div>
      </section>

      <section class="grid-item" id="github-api">
        <h2>🧑‍💻 GitHub User</h2>
        <button id="githubBtn" onclick="getGithubData()">Get User</button>
        <div class="output" id="github-output"></div>
      </section>

      <section class="grid-item" id="joke-api">
        <h2>🤣 Random Joke</h2>
        <button id="jokeBtn">Get Joke</button>
        <div class="output" id="joke-output"></div>
      </section>

      <section class="grid-item" id="public-api">
        <h2>📚 Stock Market Info</h2>
        <button id="publicApiBtn">Show One</button>
        <div class="output" id="publicapi-output"></div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
